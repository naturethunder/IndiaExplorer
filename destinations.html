<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Destinations — IndiaExplore</title>
  <meta name="description"
    content="Browse 2,389 travel destinations across all 36 states & UTs of India. Filter by type, state, budget and travel month." />
  <link rel="canonical" href="https://www.indiaexplore.example/destinations.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="IndiaExplore" />
  <meta property="og:title" content="All Destinations — IndiaExplore" />
  <meta property="og:description" content="Browse 2,389 travel destinations across all 36 states & UTs of India. Filter by type, state, budget and travel month." />
  <meta property="og:url" content="https://www.indiaexplore.example/destinations.html" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=1200&h=630&q=80" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="All Destinations — IndiaExplore" />
  <meta name="twitter:description" content="Browse 2,389 travel destinations across India. Filter by type, state, budget and month." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=1200&h=630&q=80" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap"
    media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
  <link rel="stylesheet" href="css/explore-immersive.css" />
  <link rel="stylesheet" href="css/glass-immersive.css" />
</head>

<body class="bg-slate-950 text-slate-100 explore-immersive glass-immersive">


  <!-- Immersive fixed background + cinematic overlay -->
  <div class="explore-immersive-bg" aria-hidden="true"></div>
  <div class="explore-immersive-overlay" aria-hidden="true"></div>

  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- NAVBAR (shared component) -->
  <div id="siteNav"></div>

  <!-- MAIN -->
  <main id="main" class="pt-16">

    <!-- Sub-header (Sticky below navbar) -->
    <div class="dest-subheader-wrap border-b border-white/10 sticky top-16 z-30 shadow-2xl bg-slate-950/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 py-3">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-2">
          <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight shrink-0">Destinations</h1>

          <!-- Search Input with role=search -->
          <div class="relative flex-1 max-w-2xl" role="search">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input id="searchInput" type="search"
                   placeholder="Search by destination, state, region, or type..."
                   aria-label="Search destinations"
                   class="w-full pl-10 pr-9 py-2 rounded-xl text-sm focus:outline-none text-white bg-slate-900/90 backdrop-blur-md placeholder-white/60 shadow-lg border border-white/20 transition-all focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/30" />
            <button id="searchClear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs bg-white/10 hover:bg-white/20 rounded-full w-5 h-5 flex items-center justify-center transition-colors hidden" aria-label="Clear search">✕</button>
          </div>
        </div>

        <!-- Type Filter (rendered by JS) -->
        <div class="relative">
          <div id="typeFilter" class="flex gap-2 overflow-x-auto scrollbar-hide pb-1 pt-1 scroll-smooth touch-pan-x"></div>
        </div>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex gap-6">

        <!-- ── Sidebar Filters ─────────────────────────────── -->
        <aside id="filterSidebar" class="filter-sidebar hidden lg:block w-64 shrink-0">
          <div class="filter-panel bg-white rounded-2xl border border-gray-200 p-5 sticky top-40 overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
              <h3 class="font-bold text-gray-900">Filters</h3>
              <div class="flex items-center gap-3">
                <button id="resetTop" class="text-xs text-primary font-semibold hover:underline">Reset all</button>
                <button id="filterClose"
                  class="lg:hidden w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200"
                  aria-label="Close filters">✕</button>
              </div>
            </div>

            <!-- Region (macro travel-zone; derived from state) -->
            <div class="mb-6">
              <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Region</h4>
              <select id="regionFilter" aria-label="Filter by region"
                class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-primary bg-white">
                <option value="">All Regions</option>
              </select>
            </div>

            <!-- State -->
            <div class="mb-6">
              <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">State</h4>
              <select id="stateFilter" aria-label="Filter by state"
                class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-primary bg-white">
                <option value="">All States</option>
              </select>
            </div>

            <!-- Budget / Max Price -->
            <div class="mb-6">
              <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Price / Night</h4>
              <select id="tierFilter" aria-label="Filter by price per night"
                class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-primary bg-white">
                <option value="">Any price</option>
              </select>
            </div>

            <!-- Season (derived from best-travel months) -->
            <div class="mb-6">
              <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Season</h4>
              <select id="seasonFilter" aria-label="Filter by season"
                class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-primary bg-white">
                <option value="">Any Season</option>
              </select>
            </div>

            <!-- Best Month -->
            <div>
              <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Travel Month</h4>
              <select id="monthFilter" aria-label="Filter by travel month"
                class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-primary bg-white">
                <option value="">Any Month</option>
              </select>
            </div>

            <!-- Apply (mobile drawer only) -->
            <button id="filterApply" class="lg:hidden btn btn-primary w-full mt-6">Show <span
                id="filterApplyCount">0</span> destinations</button>
          </div>
        </aside>

        <!-- ── Results ──────────────────────────────────────── -->
        <div class="flex-1 min-w-0">
          <!-- Result count + sort -->
          <div class="flex items-center justify-between mb-4">
            <p class="text-sm text-gray-600" aria-live="polite" aria-atomic="true">
              <span id="resultCount" class="font-bold text-gray-900">0</span> destinations found
            </p>
            <div class="flex items-center gap-2">
              <button id="filterOpen"
                class="lg:hidden flex items-center gap-1.5 text-sm font-semibold border border-gray-200 rounded-lg px-3 py-1.5 bg-white text-gray-700 hover:border-primary"
                aria-label="Open filters" aria-expanded="false" aria-controls="filterSidebar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                Filters<span id="filterCount"
                  class="hidden w-5 h-5 items-center justify-center rounded-full bg-primary text-white text-xs"></span>
              </button>
              <select id="sortBy" aria-label="Sort destinations"
                class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-primary bg-white">
                <option value="rating">Top Rated</option>
                <option value="latest">Latest (Newest First)</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="distance">Closest to Delhi</option>
              </select>
            </div>
          </div>

          <!-- Active filter chips -->
          <div id="activeFiltersContainer" class="flex flex-wrap items-center gap-2 mb-5 hidden">
            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Active Filters:</span>
            <div id="activeFilterChips" class="flex flex-wrap items-center gap-2"></div>
            <button id="clearAllFilters" class="text-xs font-semibold text-primary hover:underline ml-1">Clear
              all</button>
          </div>


          <!-- No results -->
          <div id="noResults" class="text-center py-20" style="display:none">
            <div class="mb-4 flex justify-center text-gray-400" aria-hidden="true">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">No destinations found</h3>
            <p class="text-gray-500 text-sm mb-6">Try adjusting your filters or search terms</p>
            <button id="resetEmpty" class="btn btn-primary">Reset Filters</button>
          </div>

          <!-- Grid (rendered by JS) -->
          <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>

          <!-- Load more (JS-controlled; renders in batches to avoid a 2,361-card first paint) -->
          <div id="loadMoreWrap" class="justify-center mt-8" style="display:none">
            <button id="loadMoreBtn" class="btn btn-outline">Show <span id="loadMoreCount">60</span> more</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER (shared component) -->
  <div id="siteFooter"></div>

  <!-- Mobile Nav (shared component) -->
  <div id="siteMobileNav"></div>

  <script type="module" src="js/pages/explore.js"></script>
  <script>
    // Navbar glass transition on scroll (explore immersive theme)
    window.addEventListener('scroll', function () {
      var nav = document.querySelector('.nav-glass');
      if (nav) nav.classList.toggle('nav-scrolled', window.scrollY > 40);
    }, { passive: true });
  </script>
</body>

</html>
