<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="50%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="goldPeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="45%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#B38628" />
    </linearGradient>
    <linearGradient id="secPeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="rgba(229, 192, 123, 0.25)" stroke-width="4"/>

  <!-- Subtle Radial Ambient Light -->
  <circle cx="256" cy="240" r="190" fill="#E5C07B" opacity="0.08" filter="url(#goldGlow)"/>

  <!-- Golden Sun -->
  <circle cx="345" cy="165" r="42" fill="#FBBF24" filter="url(#goldGlow)"/>
  <circle cx="345" cy="165" r="36" fill="#FDE68A"/>

  <!-- Secondary Mountain Peak (Right) -->
  <polygon points="255,365 335,235 415,365" fill="url(#secPeak)" opacity="0.9" />

  <!-- Primary Mountain Peak (Left / Center) -->
  <polygon points="105,365 220,150 335,365" fill="url(#goldPeak)" filter="url(#goldGlow)"/>

  <!-- Mountain Shading / Facet Detail -->
  <polygon points="220,150 335,365 220,365" fill="rgba(0,0,0,0.22)"/>

  <!-- Snow Cap Highlight -->
  <polygon points="220,150 185,215 220,205 255,215" fill="#FFFFFF"/>

  <!-- ExploreDesh "GO" Offline Badge Capsule -->
  <g transform="translate(176, 400)">
    <rect x="0" y="0" width="160" height="48" rx="24" fill="url(#goGrad)" />
    <!-- Offline Signal Wave Slash -->
    <path d="M40 24 L52 14 M52 34 L64 24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="2">GO</text>
  </g>
</svg>
